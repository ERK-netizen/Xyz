# Android APK/AAB derlemesi (CLAUDE.md §4.2): Unity 6.3 LTS, IL2CPP, ARM64, Managed Stripping +
# link.xml, Development bayrağı yok. Ücretsiz Unity Personal (Yol A): yalnız UNITY_EMAIL ve
# UNITY_PASSWORD depo sırları gerekir. Elle (workflow_dispatch), "v*" etiketi veya geliştirme dalına push ile çalışır;
# çıktı "tarih-strateji-android" yapıtıdır. APK Unity'nin hata ayıklama anahtarıyla imzalanır
# (cihaza doğrudan kurulum için); Play Store için AAB ve yayın anahtarı ayrıca gerekir.
name: Android derlemesi

on:
  workflow_dispatch:
    inputs:
      aab:
        description: "APK yerine AAB (Play Store paketi) üret"
        type: boolean
        default: false
  # Elle tetikleme yalnız varsayılan dalda bulunan iş akışlarında çalışır; geliştirme dalında
  # derleme, oyun dosyaları değişince push ile başlar (eşzamanlı eski çalıştırma iptal edilir).
  push:
    tags:
      - "v*"
    branches:
      - "claude/quirky-babbage-tv692b"
    paths:
      - "Assets/**"
      - "Packages/**"
      - "ProjectSettings/**"
      - ".github/workflows/android-build.yml"

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Unity Android (IL2CPP, ARM64)
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      CIKTI_KLASORU: Build/Android
    steps:
      - name: Lisans sırları tanımlı mı
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          if [ -z "$UNITY_EMAIL" ] || [ -z "$UNITY_PASSWORD" ]; then
            echo "::error::UNITY_EMAIL ve UNITY_PASSWORD depo sırları gerekli (Settings → Secrets and variables → Actions)."
            exit 1
          fi

      # Unity Editor + Android modülleri (SDK/NDK/JDK) ~12 GB; barındırılan çalıştırıcıda yer açılır.
      - name: Disk alanı aç
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - name: Depoyu al
        uses: actions/checkout@v4

      - name: Editör sürümünü ProjectVersion.txt'den oku
        id: surum
        run: |
          surum="$(sed -n 's/^m_EditorVersion: *//p' ProjectSettings/ProjectVersion.txt | tr -d '[:space:]')"
          if [ -z "$surum" ]; then
            echo "::error::ProjectSettings/ProjectVersion.txt içinde m_EditorVersion bulunamadı."
            exit 1
          fi
          echo "surum=$surum" >> "$GITHUB_OUTPUT"
          echo "Unity Editor sürümü: $surum" >> "$GITHUB_STEP_SUMMARY"

      - name: Unity Editor'ü Android modülüyle kur
        uses: buildalon/unity-setup@v3
        with:
          version-file: None
          unity-version: ${{ steps.surum.outputs.surum }}
          build-targets: Android
          cache-installation: true

      - name: Unity Personal lisansını etkinleştir
        uses: buildalon/activate-unity-license@v3
        with:
          license: personal
          username: ${{ secrets.UNITY_EMAIL }}
          password: ${{ secrets.UNITY_PASSWORD }}

      - name: Library önbelleği (Android)
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-android-${{ steps.surum.outputs.surum }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-android-${{ steps.surum.outputs.surum }}-

      - name: Derle
        env:
          AAB: ${{ inputs.aab && 'true' || 'false' }}
        run: |
          mkdir -p "$CIKTI_KLASORU"
          if [ "$AAB" = "true" ]; then
            cikti="$CIKTI_KLASORU/TarihStrateji.aab"; ek="-aab"
          else
            cikti="$CIKTI_KLASORU/TarihStrateji.apk"; ek=""
          fi
          set +e
          "$UNITY_EDITOR_PATH" -batchmode -nographics -quit \
            -projectPath "$GITHUB_WORKSPACE" \
            -buildTarget Android \
            -executeMethod TarihStrateji.Unity.Editor.AndroidBuild.BuildFromCommandLine \
            -ciktiYolu "$cikti" $ek \
            -logFile "$CIKTI_KLASORU/unity-derleme.log"
          kod=$?
          set -e
          grep -E "error CS|Error building|BuildFailedException|Sonuç:" "$CIKTI_KLASORU/unity-derleme.log" | tail -n 40 || true
          if [ "$kod" -ne 0 ] || [ ! -f "$cikti" ]; then
            tail -n 120 "$CIKTI_KLASORU/unity-derleme.log" || true
            echo "::error::Android derlemesi başarısız (çıkış kodu $kod); unity-derleme.log yapıtına bakın."
            exit 1
          fi
          {
            echo "### Android derlemesi"
            echo '```'
            cat "$CIKTI_KLASORU/derleme-ozeti.txt"
            echo '```'
            echo "Dosya: \`$(basename "$cikti")\` — $(du -h "$cikti" | cut -f1)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: APK/AAB yapıtını yükle
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: tarih-strateji-android
          path: |
            Build/Android/*.apk
            Build/Android/*.aab
            Build/Android/derleme-ozeti.txt
          if-no-files-found: error
          retention-days: 30

      - name: Derleme günlüğünü yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-android-gunlugu
          path: Build/Android/unity-derleme.log
          if-no-files-found: ignore
          retention-days: 14
